<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>TinyURL to Custom .com Link Converter</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      background-color: #f3f4f6;
      margin: 0;
      padding: 0;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
    }
    .container {
      text-align: center;
      background: #fff;
      padding: 20px;
      border-radius: 10px;
      box-shadow: 0 4px 8px rgba(0, 0, 0, 0.2);
      max-width: 400px;
      width: 100%;
    }
    h1 {
      color: #0078d4;
    }
    label {
      display: block;
      margin: 10px 0;
    }
    input {
      width: 90%;
      padding: 10px;
      margin-bottom: 15px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 20px;
      color: #fff;
      background-color: #0078d4;
      border: none;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background-color: #005bb5;
    }
    .output {
      margin-top: 15px;
      padding: 10px;
      background-color: #e7f3ff;
      border: 1px solid #0078d4;
      border-radius: 5px;
    }
    .output a {
      color: #0078d4;
      text-decoration: none;
    }
    .output a:hover {
      text-decoration: underline;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>TinyURL to .com Converter</h1>
    <label for="tinyurl-input">Enter TinyURL:</label>
    <input type="text" id="tinyurl-input" placeholder="https://tinyurl.com/example" />
    <button id="convert-btn">Convert</button>
    <div id="output" class="output"></div>
  </div>
  <script>
    document.getElementById("convert-btn").addEventListener("click", function () {
      const tinyurl = document.getElementById("tinyurl-input").value.trim();
      if (!tinyurl || !tinyurl.startsWith("https://tinyurl.com/")) {
        alert("Please enter a valid TinyURL link.");
        return;
      }

      // Generate a custom .com URL
      const customDomain = tinyurl.replace("https://tinyurl.com/", "https://customdomain.com/");

      // Display the new link
      const outputDiv = document.getElementById("output");
      outputDiv.innerHTML = `
        <p>Converted Link:</p>
        <a href="${tinyurl}" target="_blank">${customDomain}</a>
      `;

      // Optional: Save the link as a file (simulate)
      const fileName = "converted-link.txt";
      const fileContent = `Original Link: ${tinyurl}\nCustom Link: ${customDomain}`;
      const blob = new Blob([fileContent], { type: "text/plain" });
      const link = document.createElement("a");
      link.href = URL.createObjectURL(blob);
      link.download = fileName;
      link.textContent = "Download Link File";
      link.style.display = "block";
      link.style.marginTop = "10px";
      outputDiv.appendChild(link);
    });
  </script>
</body>
</html>
